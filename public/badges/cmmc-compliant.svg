  <!-- Subtext -->
  <text x="50" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="6.5" font-weight="800" fill="#0f172a" text-anchor="middle" letter-spacing="1.2">COMPLIANT</text>

  <!-- Bottom Emerald Chevron -->
